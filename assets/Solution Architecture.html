    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #fafbfc;
        padding: 32px;
        color: #1a1a2e;
      }
      h1 {
        font-size: 20px;
        font-weight: 700;
        color: #232f3e;
        margin-bottom: 4px;
      }
      .subtitle {
        font-size: 13px;
        color: #5f6b7a;
        margin-bottom: 24px;
      }
      .diagram {
        width: 100%;
        overflow-x: auto;
      }
      svg {
        width: 100%;
        height: auto;
        min-width: 1100px;
      }
      /* Region boxes */
      .region-box {
        fill: none;
        stroke: #232f3e;
        stroke-width: 2;
        stroke-dasharray: 6 3;
        rx: 12;
      }
      .region-primary {
        stroke: #147eba;
      }
      .region-secondary {
        stroke: #d45b07;
      }
      .region-label {
        font-size: 13px;
        font-weight: 700;
        fill: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .region-label-bg-primary {
        fill: #147eba;
        rx: 4;
      }
      .region-label-bg-secondary {
        fill: #d45b07;
        rx: 4;
      }

      /* Section boxes */
      .section-box {
        fill: #ffffff;
        stroke: #d5dbdb;
        stroke-width: 1.5;
        rx: 8;
      }
      .section-label {
        font-size: 11px;
        font-weight: 600;
        fill: #232f3e;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      /* Service boxes */
      .service-box {
        fill: #f7f8fa;
        stroke: #d5dbdb;
        stroke-width: 1;
        rx: 6;
      }
      .service-text {
        font-size: 10px;
        fill: #333;
        text-anchor: middle;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .service-text-bold {
        font-size: 10px;
        fill: #232f3e;
        font-weight: 600;
        text-anchor: middle;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      /* Arrows */
      .arrow {
        stroke: #5f6b7a;
        stroke-width: 1.5;
        fill: none;
        marker-end: url(#arrowhead);
      }
      .arrow-replication {
        stroke: #8b5cf6;
        stroke-width: 2;
        stroke-dasharray: 5 3;
        fill: none;
        marker-end: url(#arrowhead-purple);
      }
      .arrow-failover {
        stroke: #d45b07;
        stroke-width: 2;
        stroke-dasharray: 4 2;
        fill: none;
        marker-end: url(#arrowhead-orange);
      }
      .arrow-global {
        stroke: #147eba;
        stroke-width: 2;
        fill: none;
        marker-end: url(#arrowhead-blue);
      }

      /* Flow steps */
      .flow-step {
        fill: #ffffff;
        stroke: #d5dbdb;
        stroke-width: 1.5;
        rx: 4;
      }
      .flow-text {
        font-size: 9px;
        fill: #333;
        text-anchor: middle;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      /* Global layer */
      .global-box {
        fill: #eef6ff;
        stroke: #147eba;
        stroke-width: 2;
        rx: 10;
      }

      /* Cross-region box */
      .cross-region-box {
        fill: #f3f0ff;
        stroke: #8b5cf6;
        stroke-width: 1.5;
        stroke-dasharray: 4 2;
        rx: 8;
      }

      /* Legend */
      .legend-text {
        font-size: 10px;
        fill: #5f6b7a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      /* AWS service icon colors */
      .aws-orange {
        fill: #d45b07;
      }
      .aws-blue {
        fill: #147eba;
      }
      .aws-green {
        fill: #1b660f;
      }
      .aws-purple {
        fill: #8b5cf6;
      }
    </style>
  </head>

    <h1>Solution Architecture</h1>
    <p class="subtitle">
      Single-region logical view • Email ingestion → IDP → item store • Agent →
      Shared services
    </p>

        <text x="125" y="87" class="service-text">Outlook Shared Inbox</text>

        <path class="arrow" d="M210,79 L244,79"></path>

        <!-- ========== IDP PIPELINE ========== -->
        <rect
          class="section-box"
          x="250"
          y="20"
          width="930"
          height="210"

        <text x="265" y="38" class="section-label">IDP Pipeline</text>

        <rect class="flow-step" x="268" y="50" width="160" height="58"></rect>
        <text x="348" y="67" class="flow-text">Generate unique Event ID</text>
        <text x="348" y="79" class="flow-text">Store raw email +</text>
        <text x="348" y="91" class="flow-text">attachments in S3</text>

        <path class="arrow" d="M430,79 L446,79"></path>

        <rect class="flow-step" x="450" y="50" width="160" height="58"></rect>
        <text x="530" y="67" class="flow-text">Classify</text>
        <text x="530" y="79" class="flow-text">Event type, Mandatory/</text>
        <text x="530" y="91" class="flow-text">Voluntary, Custodian</text>
