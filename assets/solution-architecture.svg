          width="230"
          height="40"
        ></rect>
        <text x="410" y="556" class="service-text-bold">
          App Database — Amazon DynamoDB
        </text>

        <!-- Frontend to AgentCore Runtime -->
        <path class="arrow" d="M540,453 L584,453"></path>

        <!-- ========== AGENTCORE RUNTIME ========== -->
        <rect
